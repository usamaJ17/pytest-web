name: Publish to PyPI

on:
  push:
    tags:
      - "v*"   # triggers on v0.2.0, v0.3.0, etc.

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate: CI must be green before publishing
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/pytest-web
    permissions:
      id-token: write

    steps:
      - name: Download dist from CI
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
